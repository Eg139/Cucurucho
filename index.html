<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CUCURUCHO">
<meta name="theme-color" content="#0a0a0a">
<meta name="description" content="CUCURUCHO - Sistema de ventas heladería by NaluSoft">
<title>CUCURUCHO - by NaluSoft</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="nalusoft.jpg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="bienvenida">
  <div class="logo">🍦</div>
  <h1 id="tituloBienvenida">TU HELADERÍA</h1>
  <div class="linea"></div>
  <p id="subBienvenida">Sistema de Ventas</p>

  <div id="paso1">
    <p style="opacity:.6;margin-top:30px">¿Cómo se llama tu negocio?</p>
    <input id="negocioInput" placeholder="Ej: Chocorlatte, Grido, etc">
    <button onclick="guardarNegocio()">SIGUIENTE</button>
  </div>
  <div id="paso2" style="display:none">
    <p style="opacity:.6;margin-top:30px">Ahora tu nombre para el turno</p>
    <input id="nombreInput" placeholder="Ej: Tomas">
    <button onclick="guardarNombre()">SIGUIENTE</button>
    <span onclick="cambiarNegocio()" style="display:block;margin-top:16px;font-size:12px;color:#666;text-decoration:underline">cambiar nombre del negocio</span>
  </div>
  <div id="paso3" style="display:none;text-align:left">
    <p style="opacity:.6;margin-top:30px;text-align:center">Configurá tus precios</p>
    <div id="listaPreciosConfig"></div>
    <button onclick="guardarPrecios()" style="margin-top:20px">GUARDAR PRECIOS Y ENTRAR</button>
  </div>
</div>

<div id="app" style="display:none">
  <div class="topbar">
    <div><div class="brand-sub" id="brandTop"></div><div id="saludo"></div></div>
    <button class="btn-salir" onclick="cambiarUsuario()">↪ Salir</button>
  </div>

  <div style="margin-top:22px">
    <div style="font-size:11px;opacity:.5;letter-spacing:1px;margin-bottom:8px">ELEGÍ EL PRODUCTO</div>
    <div id="botones" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"></div>
  </div>

  <div id="carrito" style="margin-top:16px;display:none">
    <div style="font-size:11px;opacity:.5;letter-spacing:1px;margin-bottom:6px">CARRITO</div>
    <div id="carritoLista"></div>
    <div style="display:flex;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px dashed #333">
      <span style="opacity:.6">Total pedido</span><b id="carritoTotal"></b>
    </div>
  </div>

  <div id="bloqueCobro" style="display:none">
    <div class="pay-grid">
      <button class="pay-btn pay-efectivo" onclick="cobrar('EFECTIVO')">🟢 EFECTIVO</button>
      <button class="pay-btn pay-mp" onclick="cobrar('MP')">🔵 MERCADO PAGO</button>
      <button class="pay-btn pay-trans" onclick="cobrar('TRANSFER')">TRANSFER.</button>
      <button class="pay-btn pay-py" id="btnPY"></button>
    </div>
    <div id="previewPY" style="display:none;margin-top:10px;background:#2a1a1a;border:1px solid #dc2626;border-radius:12px;padding:10px;text-align:center;font-size:13px"></div>
    <button onclick="vaciarCarrito()" style="background:transparent;color:#666;border:1px solid #2a2a2a;margin-top:8px;font-size:13px">VACIAR CARRITO</button>
  </div>

  <div style="margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <div style="background:#161616;border:1px solid #2a2a2a;border-radius:14px;padding:14px">
      <div style="font-size:10px;opacity:.5;letter-spacing:1px">HOY (turno actual)</div><div id="totalHoy"></div><div id="cantHoy"></div>
    </div>
    <div style="background:#2a2113;border:1px solid #e9a23b;border-radius:14px;padding:14px">
      <div style="font-size:10px;opacity:.6;letter-spacing:1px">MES (1 al hoy)</div><div id="totalMes"></div><div id="cantMes"></div>
    </div>
  </div>
  <div id="info" style="opacity:.5;font-size:11px;margin-top:10px;text-align:center"></div>

  <button onclick="cerrarTurno()" style="background:#e9a23b;color:#000;margin-top:16px;border:2px solid #e9a23b">🔒 CERRAR TURNO ACTUAL</button>
  <button onclick="verCierres()" style="background:transparent;color:#888;border:1px solid #2a2a2a;margin-top:8px;font-size:12px">VER HISTORIAL DE CIERRES</button>

  <div class="detalle-ventas">
    <div class="detalle-head" onclick="toggleVentas()"><b id="tituloVentas">VENTAS DEL DÍA</b><span id="btnToggleVentas">▼ Ver ventas</span></div>
    <div class="detalle-body" id="contenedorLista"><div id="lista"></div></div>
  </div>

  <button onclick="exportarDiario()" style="background:#fff;color:#000;margin-top:32px">EXPORTAR VENTA DIARIA</button>
  <button onclick="exportarMes()" style="background:transparent;color:#fff;border:1.5px solid #2a2a2a;margin-top:10px">EXPORTAR TODO EL MES (1 al hoy)</button>
</div>

<div id="modalCierres" class="modal" onclick="if(event.target===this) cerrarModal()">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between;align-items:center"><b>HISTORIAL DE CIERRES</b><button onclick="cerrarModal()" style="width:auto;padding:6px 12px;background:#222;color:#fff;margin:0">X</button></div>
    <div id="listaCierres" style="margin-top:12px"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
